; Reproduit exactement public/.user.ini — conservé ici en plus, pas à la
; place, car il n'est pas garanti que le SAPI embarqué de FrankenPHP lise
; les .user.ini par dossier de la même façon qu'un PHP-FPM/CGI classique.
; Les installeurs desktop/mobile (AppReleaseController) peuvent peser
; plusieurs centaines de Mo — bien au-delà des limites par défaut de PHP.
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
memory_limit = 256M
