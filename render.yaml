# Blueprint Render — détecté automatiquement par Render à l'import du dépôt
# (bouton "New > Blueprint", sélectionner ce repo). Définit le service web,
# le worker planificateur+queue et la base PostgreSQL en une fois, à partir
# du même backend/Dockerfile que celui utilisé sur Railway (voir
# deploiement.md pour le détail des choix et leur historique).
#
# Après l'import, Render demande une valeur pour chaque variable marquée
# "sync: false" ci-dessous — voir backend/.env.example pour la description
# complète de chacune. APP_KEY doit être IDENTIQUE sur les deux services
# (générée une fois avec `php artisan key:generate --show`, collée aux
# deux endroits) : des clés différentes rendraient illisibles les sessions/
# caches que les deux processus partagent dans la même base.

databases:
  - name: sckolaris-db
    databaseName: sckolaris
    user: sckolaris
    plan: free

services:
  - type: web
    name: sckolaris-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Backend SCKOLARIS"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false # à renseigner après le 1er déploiement (domaine .onrender.com)
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_MAINTENANCE_DRIVER
        value: file
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase: sckolaris-db
        property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: AI_MAX_INDEXABLE_FILE_MB
        value: "100"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: SCKOLARIS
      - key: CONTACT_EMAIL
        sync: false
      - key: RELEASE_UPLOAD_TOKEN
        sync: false
      - key: RSCRIPT_BIN
        value: Rscript

  # Planificateur (statut "en ligne") + worker de queue (indexation IA) —
  # voir deploiement.md "Worker de queue" pour pourquoi ces deux tâches
  # existent et pourquoi elles ne tournent pas dans le service web.
  - type: cron
    name: sckolaris-scheduler-queue
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "*/5 * * * *"
    dockerCommand: sh docker/run-cron-and-queue.sh
    envVars:
      - key: APP_KEY
        sync: false # même valeur que sur sckolaris-backend, voir note en tête de fichier
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase: sckolaris-db
        property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: AI_MAX_INDEXABLE_FILE_MB
        value: "100"
      - key: SESSION_DRIVER
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
